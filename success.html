<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Successful</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: "Segoe UI", sans-serif;
            color: white;
            text-align: center;
        }

        .success-box {
            background: rgba(255,255,255,0.08);
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .success-box h1 {
            color: #5efce8;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .success-box p {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .success-box a {
            display: inline-block;
            padding: 10px 26px;
            background: #5efce8;
            color: #0f2027;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        .success-box a:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="success-box">
        <h1>Registration Successful 🎉</h1>
        <p>
            Your registration for LogicLoom TechFest has been completed successfully.<br>
            All the best! We look forward to seeing your talent.
        </p>
        <a href="index.html">Go Back to Home</a>
    </div>

</body>
</html>
